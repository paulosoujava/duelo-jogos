<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duelo! Jogos para dois</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: brincalhão e barulhento, fliperama de bolso
   IDEA: uma caixa de brinquedo de plástico, peças gordinhas com contorno preto
   PICTURE: dois bonequinhos (vermelho x azul) se encarando, que viram os jogadores
   COLOUR and TYPE: amarelo-sol, tomate e azul, contorno grosso; Lilita One + Nunito
   LAYOUT: coluna de celular; sala com convite, placar no topo do jogo, tabuleiro grande */
:root{color-scheme:light dark;
--bg:light-dark(#ffd84d,#1f1b12);--dot:light-dark(#f4c51c,#2a2416);
--card:light-dark(#fff8e4,#2f2919);--field:light-dark(#fff,#1f1b12);
--ink:light-dark(#1c1917,#fff3d1);--soft:light-dark(#6b5a35,#c9b98e);
--line:light-dark(#1c1917,#050403);--p0:#ff4b3e;--p1:#2f6bff;--gold:#ffd84d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(var(--dot) 1.7px,transparent 2.2px) 0 0/20px 20px,var(--bg);color:var(--ink);font:700 16px/1.45 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px dashed var(--p1);outline-offset:3px}
.view{display:none;max-width:980px;margin:0 auto;padding:18px max(4vw,14px) 40px}
.view.on{display:block;animation:enter .35s ease}
#play,#home{max-width:560px}#lobby{max-width:760px}
.L{font-family:'Lilita One',Impact,sans-serif;font-weight:400}

.hero{text-align:center;padding-top:10px}
.logo{font:400 clamp(70px,19vw,124px)/.9 'Lilita One',Impact,sans-serif;margin:0;color:#fff;transform:rotate(-3deg);
text-shadow:3px 0 var(--line),-3px 0 var(--line),0 3px var(--line),0 -3px var(--line),2px 2px var(--line),-2px -2px var(--line),2px -2px var(--line),-2px 2px var(--line),0 9px 0 var(--line)}
.logo span{color:var(--p0);display:inline-block;animation:wig 1.6s ease-in-out infinite}
.sub{font-size:17px;margin:18px 0 0}
.faces{display:flex;justify-content:center;align-items:center;gap:clamp(10px,4vw,28px);margin:26px 0 4px}
.faces .av{width:clamp(96px,28vw,140px);aspect-ratio:1;animation:bob 2.4s ease-in-out infinite}
.faces .av+.vs+.av{animation-delay:-1.2s}
.vs{font:400 30px/1 'Lilita One',sans-serif;width:62px;height:62px;flex:none;display:grid;place-items:center;background:var(--gold);color:#1c1917;border:3px solid var(--line);border-radius:50%;box-shadow:0 5px 0 var(--line);animation:pulse 1.2s ease-in-out infinite}
.panel{background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:0 7px 0 var(--line);padding:20px 18px;margin-top:22px}
.invite{background:var(--p1);color:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 14px;margin:0 0 14px;font-weight:900;text-align:center}
.field{display:grid;gap:6px;font-weight:900}
.field input,.inp{width:100%;font:800 18px Nunito,sans-serif;padding:12px 14px;border:3px solid var(--line);border-radius:15px;background:var(--field);color:var(--ink)}
.field input:focus,.inp:focus{outline:3px solid var(--p0);outline-offset:2px}
.stackb{display:grid;gap:12px;margin-top:16px}
.err{color:var(--p0);min-height:1.3em;margin:8px 0 0;font-size:15px}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}
.chip{min-height:44px;padding:0 16px;border:3px solid var(--line);border-radius:99px;background:var(--card);font-weight:900;font-size:15px}

.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:52px;padding:0 22px;border:3px solid var(--line);border-radius:16px;background:var(--p0);color:#fff;font:400 20px 'Lilita One',sans-serif;box-shadow:0 5px 0 var(--line);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.blue{background:var(--p1)}
.btn.gold{background:var(--gold);color:#1c1917}

.top{display:flex;align-items:center;gap:10px}
.top h2{flex:1;text-align:center;margin:0;font:400 27px/1.1 'Lilita One',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:48px;height:48px;flex:none;border:3px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;padding:0}
.ico:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

.duo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin-top:20px}
.who{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px 10px;box-shadow:0 6px 0 var(--line);transform:rotate(-1.5deg);transition:opacity .3s}
#who1{transform:rotate(1.5deg)}
.who .av{width:clamp(70px,20vw,104px);aspect-ratio:1;animation:bob 2.4s ease-in-out infinite}
#who1 .av{animation-delay:-1.2s}
.who.off{opacity:.55}.who.off .av{animation:none;filter:grayscale(.8)}
.wn{font:400 22px/1.1 'Lilita One',sans-serif;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:13px;font-weight:900;color:#fff;background:var(--p0);border:2px solid var(--line);padding:1px 10px;border-radius:99px}
#who1 .tag{background:var(--p1)}
.who.off .tag{background:var(--soft)}
.who .inp{font-size:16px;text-align:center;padding:8px}
.share{margin-top:24px}
.share h3,.pick{font:400 27px/1.1 'Lilita One',sans-serif;margin:0 0 6px}
.linkbox{display:flex;gap:8px;margin-top:12px}
.linkbox input{flex:1;font:700 14px/1 ui-monospace,Menlo,monospace;padding:12px;border:3px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink)}
.linkbox .btn{min-height:48px;padding:0 16px;font-size:18px;flex:none}
.note{font-size:14px;color:var(--soft);margin:10px 0 0}
.netline{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:900}
.led{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:#c9b98e;flex:none}
.led.on{background:#ffd84d;animation:pulse 1s infinite}.led.ok{background:var(--p1)}.led.bad{background:var(--p0)}
.pick{text-align:center;margin:34px 0 14px;font-size:30px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:18px}
.game{display:grid;grid-template-columns:90px minmax(0,1fr);align-content:center;column-gap:14px;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--line);transition:transform .12s,box-shadow .12s,opacity .2s}
.game:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.game:disabled{opacity:.5}
.art{grid-row:1/4;width:90px;height:90px;border-radius:18px;border:3px solid var(--line);display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.art svg{width:76%}
.game:hover:not(:disabled) .art{transform:rotate(-7deg) scale(1.06)}
.a0{background:var(--p0)}.a1{background:var(--p1)}.a2{background:#fff1c9}
.gt{font:400 24px/1.1 'Lilita One',sans-serif}
.gd{font-size:15px;color:var(--soft)}
.gs{font-size:13px;font-weight:900;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-top:16px}
.bar .x{font:400 22px 'Lilita One',sans-serif}
.pl{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:5px 10px 5px 5px;box-shadow:0 4px 0 var(--line);transition:background .25s,color .25s,transform .25s,opacity .3s}
#pl1{flex-direction:row-reverse;padding:5px 5px 5px 10px;text-align:right}
.pl .av{width:44px;height:44px;flex:none}
.pt2{flex:1;display:grid;line-height:1.15}
.pn{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{font-size:12px;font-weight:800;opacity:.75}
.ps{font:400 27px/1 'Lilita One',sans-serif}
.pl.on{color:#fff;transform:translateY(-4px)}#pl0.on{background:var(--p0)}#pl1.on{background:var(--p1)}
.pl.on .av{animation:bob .9s ease-in-out infinite}
.pl.off{opacity:.5}
.status{text-align:center;font-weight:900;font-size:17px;margin:18px 0 14px;min-height:1.45em;text-wrap:balance}
.status.wait::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
.bump{animation:pop .3s ease}
.tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}
.tools .btn{font-size:17px;min-height:46px}
.locked{pointer-events:none}

.velha{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--line);padding:10px;border-radius:28px;width:min(100%,440px);margin:0 auto;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:filter .3s}
.velha.locked{filter:saturate(.75)}
.cell{border:0;background:var(--card);border-radius:17px;display:grid;place-items:center;padding:0;aspect-ratio:1;transition:background .2s}
.cell:active:not(.f){background:light-dark(#ffeaa0,#3b3320)}
.mk{width:76%;height:76%;fill:none;stroke-width:14;stroke-linecap:round;animation:pop .3s ease}
.c0 .mk{stroke:var(--p0)}.c1 .mk{stroke:var(--p1)}
.mk path,.mk circle,.wl path{stroke-dasharray:1;animation:draw .28s ease-out both}
.cell.w{animation:flash .5s ease 3 alternate}
.wl{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);pointer-events:none;overflow:visible}
.wl path{stroke-width:13;stroke-linecap:round;fill:none;animation-duration:.45s}

.forca{display:grid;gap:14px}
.gal{background:var(--card);border:3px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:10px 10px 4px}
.gsvg{display:block;width:100%;height:min(30vh,230px)}
.wood{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.rope{stroke:#c98a3d;stroke-width:5;stroke-linecap:round}
.guy path{stroke:var(--ink);stroke-width:8;stroke-linecap:round;fill:none}
.guy .head{stroke:var(--ink);stroke-width:5}
.pt{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;transition:opacity .25s,transform .4s cubic-bezier(.3,1.8,.5,1)}
.pt.on{opacity:1;transform:none}
.gal.shake{animation:shake .35s}
.ex,.sm{display:none}.dead .ex{display:inline}.dead .eo,.happy .eo2{display:none}.happy .sm{display:inline}
.happy .guy{animation:jump .45s ease 3}
.info{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.hint b{font-weight:900}
.lives{display:flex;gap:5px;align-items:center}
.lf{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);background:var(--p0);transition:background .3s,transform .3s}
.lf.x{background:transparent;transform:scale(.8)}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 20px;padding:4px 0}
.wg{display:flex;gap:5px}
.lt{width:clamp(24px,8vw,38px);height:clamp(36px,10vw,50px);border-bottom:5px solid var(--ink);display:grid;place-items:center;font:400 clamp(22px,7vw,32px)/1 'Lilita One',sans-serif}
.lt i{font-style:normal}.lt.on i{animation:pop .35s ease}.lt.miss i{color:var(--p0)}.lt.gh i{opacity:.28}
.lt.sym{border:0}
.kb{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;transition:opacity .3s}
.kb.locked{opacity:.55}
.key{height:50px;border:3px solid var(--line);border-radius:13px;background:var(--card);box-shadow:0 4px 0 var(--line);font:400 23px 'Lilita One',sans-serif;padding:0;transition:transform .1s,box-shadow .1s,opacity .2s}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.ok{background:var(--gold);color:#1c1917}
.key.no{opacity:.3;text-decoration:line-through;box-shadow:none;transform:translateY(3px)}
.pickw{text-align:left}
.pickw h3{font:400 28px/1.1 'Lilita One',sans-serif;margin:0 0 4px}
.pickw .field{margin-top:12px}
.pw{display:flex;gap:8px}
.eye{min-width:68px;border:3px solid var(--line);border-radius:14px;background:var(--gold);color:#1c1917;font-weight:900}
.waitc{text-align:center;padding:26px 18px}
.waitc .av{width:120px;margin:0 auto;display:block;animation:think 1.4s ease-in-out infinite}
.waitc p{font-size:18px;font-weight:900;margin:14px 0 0}

.board{position:relative;width:min(100%,520px);aspect-ratio:1;margin:0 auto;border:5px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 0 var(--line)}
.sqs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}
.sq.l{background:#ffe7a8}.sq.d{background:#8b4f32;border:0;padding:0;position:relative}
.sq.tgt::after{content:'';position:absolute;inset:31%;border-radius:50%;background:var(--gold);border:3px solid #1c1917;animation:pulse .9s ease-in-out infinite}
.pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;display:grid;place-items:center;transform:translate(calc(var(--c)*100%),calc(var(--r)*100%));transition:transform .26s cubic-bezier(.4,1.4,.6,1)}
.disc{width:80%;height:80%;border-radius:50%;border:3px solid #1c1917;display:grid;place-items:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),inset 0 4px 0 rgba(255,255,255,.35),0 3px 0 #1c1917;transition:transform .22s,opacity .3s}
.c0 .disc{background:var(--p0)}.c1 .disc{background:var(--p1)}
.disc svg{width:62%;opacity:0;transform:scale(0) rotate(-30deg);transition:transform .4s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.pc.k .disc svg{opacity:1;transform:none}
.pc.sel{z-index:3}.pc.sel .disc{transform:scale(1.14) translateY(-3px);outline:4px solid var(--gold);outline-offset:1px}
.pc.mv{z-index:4}
.pc.must .disc{animation:glow 1s ease-in-out infinite}
.pc.hit .disc{opacity:.35;transform:scale(.8)}
.pc.dead .disc{opacity:0;transform:scale(0) rotate(120deg)}
.pc.nope .disc{animation:shake .3s}

.modal{position:fixed;inset:0;background:rgba(20,16,8,.6);display:grid;place-items:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.box{position:relative;width:min(100%,420px);max-height:94vh;overflow:auto;background:var(--card);border:4px solid var(--line);border-radius:28px;box-shadow:0 9px 0 var(--line);padding:26px 20px 22px;text-align:center}
.modal.in .box{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
.box h2{font:400 32px/1.05 'Lilita One',sans-serif;margin:6px 0 8px;text-wrap:balance}
.box p{margin:6px 0}
.trophy{width:112px;margin:0 auto;animation:bob 1s ease-in-out infinite}
.sc{font-weight:900;margin-top:10px!important}.sc b{font:400 24px 'Lilita One',sans-serif}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.mx{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;background:none;padding:0;display:grid;place-items:center}
.mx svg{width:22px;stroke:currentColor;stroke-width:3.5;stroke-linecap:round}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);background:var(--ink);color:var(--bg);font-weight:900;padding:12px 20px;border-radius:99px;z-index:40;transition:transform .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

.a3{background:var(--gold)}
.dom{display:grid;gap:14px}
.opp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:900}
.opp .av{width:38px;flex:none}
.backs{display:flex;gap:3px;flex-wrap:wrap}
.bk{width:15px;height:28px;border-radius:4px;border:2px solid var(--line);background:repeating-linear-gradient(45deg,var(--bc) 0 4px,color-mix(in srgb,var(--bc) 70%,#fff) 4px 7px)}
.table{position:relative;min-height:190px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:4px;padding:34px 12px 16px;background:#8b4f32;border:4px solid var(--line);border-radius:24px;box-shadow:inset 0 0 0 6px rgba(255,255,255,.08),0 7px 0 var(--line)}
.pilec{position:absolute;top:8px;right:12px;font-size:13px;font-weight:900;color:#fff3d1}
.empty{color:#fff3d1;font-weight:900;text-align:center;margin:0;width:100%}
.hand .empty{color:var(--soft)}
.ct{display:block}.ct .tl{display:block;height:30px;filter:drop-shadow(0 2px 0 #1c1917)}.ct .tl.v{height:56px}
.endc{min-width:52px;height:44px;padding:0 8px;border-radius:12px;border:3px dashed rgba(255,243,209,.55);color:#fff3d1;font:400 20px 'Lilita One',sans-serif;background:transparent;display:grid;place-items:center;pointer-events:none}
.endc.go{border-style:solid;border-color:#1c1917;background:var(--gold);color:#1c1917;animation:pulse .9s ease-in-out infinite;pointer-events:auto}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:100px;padding-top:12px}
.ht{border:0;background:none;padding:0;border-radius:10px;transition:transform .2s,opacity .2s,box-shadow .2s}
.ht .tl{display:block;height:84px;filter:drop-shadow(0 4px 0 var(--line))}
.ht.ok{transform:translateY(-8px);outline:4px solid var(--p1);outline-offset:3px}
.ht.dim{opacity:.45}
.ht.sel{transform:translateY(-16px) rotate(-5deg);outline:4px solid var(--p0);outline-offset:3px}
.new{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
.cover{width:100%;min-height:96px;font-size:21px}
@media(max-width:380px){.ht .tl{height:72px}}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
@keyframes think{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes wig{50%{transform:rotate(14deg) scale(1.1)}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}}
@keyframes popin{from{transform:scale(.5) rotate(-6deg);opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes flash{to{background:var(--gold)}}
@keyframes jump{50%{transform:translateY(-14px)}}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@keyframes glow{50%{box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 0 0 5px var(--gold),0 3px 0 #1c1917}}
@media(max-width:380px){.vs{width:48px;height:48px;font-size:22px}.game{grid-template-columns:76px minmax(0,1fr)}.art{width:76px;height:76px}.key{height:46px;font-size:20px}.linkbox{flex-wrap:wrap}.linkbox .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- INÍCIO -->
<main id="home" class="view on">
  <header class="hero">
    <h1 class="logo">Duelo<span>!</span></h1>
    <p class="sub">Três jogos, dois jogadores, cada um no seu celular.</p>
  </header>
  <div class="faces" aria-hidden="true"><span class="av" id="hf0"></span><span class="vs">VS</span><span class="av" id="hf1"></span></div>
  <section class="panel">
    <p class="invite" id="invite" hidden></p>
    <label class="field">Seu nome<input id="myname" maxlength="12" placeholder="Como te chamam?" autocomplete="off" enterkeyhint="go"></label>
    <p class="err" id="herr"></p>
    <div class="stackb">
      <button class="btn" id="bHost">Criar sala e chamar um amigo</button>
      <button class="btn blue" id="bJoin" hidden>Entrar no duelo</button>
      <button class="btn ghost" id="bLocal">Jogar os dois neste celular</button>
    </div>
  </section>
  <footer class="foot"><button class="chip" id="mute1">Som ligado</button></footer>
</main>

<!-- SALA -->
<main id="lobby" class="view">
  <div class="top">
    <button class="ico" id="leave" aria-label="Sair da sala"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="lobTitle">Sala</h2>
    <button class="ico mutebtn" aria-label="Ligar ou desligar som"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M17 9c1.5 1.6 1.5 4.4 0 6M19.5 6.5c3 3 3 8 0 11"/></svg></button>
  </div>
  <section class="duo">
    <div class="who" id="who0"><span class="av"></span><span class="wn"></span><span class="tag"></span></div>
    <div class="vs">VS</div>
    <div class="who" id="who1"><span class="av"></span><span class="wn"></span><input class="inp" id="n2" maxlength="12" placeholder="Nome do jogador 2" autocomplete="off" hidden><span class="tag"></span></div>
  </section>
  <section class="panel share" id="share">
    <h3 id="shareH">Chame seu adversário</h3>
    <p id="shareP" style="margin:0">Mande este link. Quando ele abrir e colocar o nome, o duelo começa.</p>
    <div class="linkbox"><input id="link" readonly aria-label="Link da sala"><button class="btn gold" id="copy">Copiar</button></div>
    <div class="row" id="shareRow" style="justify-content:flex-start;margin-top:12px" hidden><button class="btn blue" id="nshare">Compartilhar</button></div>
    <div class="netline"><span class="led" id="led"></span><span id="netTxt">Conectando…</span></div>
    <p class="note" id="netNote"></p>
    <div class="row" style="justify-content:flex-start;margin-top:10px" id="retryRow" hidden><button class="btn ghost" id="retry">Tentar de novo</button></div>
  </section>
  <h2 class="pick">Escolham o jogo</h2>
  <section class="games">
    <button class="game" data-g="velha"><span class="art a0"><svg viewBox="0 0 60 60" fill="none" stroke-linecap="round"><path d="M22 8V52M38 8V52M8 22H52M8 38H52" stroke="#fff" stroke-width="4"/><path d="M10 10l8 8M18 10l-8 8M42 42l8 8M50 42l-8 8" stroke="#1c1917" stroke-width="4.5"/><circle cx="30" cy="30" r="5" stroke="#ffd84d" stroke-width="4.5"/><circle cx="46" cy="14" r="5" stroke="#ffd84d" stroke-width="4.5"/></svg></span><span class="gt">Jogo da Velha</span><span class="gd">Três em linha e é seu. Rápido e nervoso.</span><span class="gs" id="s-velha"></span></button>
    <button class="game" data-g="forca"><span class="art a1"><svg viewBox="0 0 60 60" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 54H36M16 54V8H42V16" stroke="#fff" stroke-width="5"/><circle cx="42" cy="23" r="7" fill="#ffd84d" stroke="#1c1917" stroke-width="3"/><path d="M42 30V42M42 34l-6 5M42 34l6 5M42 42l-5 8M42 42l5 8" stroke="#1c1917" stroke-width="3.5"/></svg></span><span class="gt">Forca</span><span class="gd">Palavra sorteada. Os dois disputam letra por letra.</span><span class="gs" id="s-forca"></span></button>
    <button class="game" data-g="damas"><span class="art a2"><svg viewBox="0 0 60 60"><rect x="4" y="4" width="52" height="52" rx="5" fill="#ffe7a8" stroke="#1c1917" stroke-width="3"/><path d="M17 5h13v13H17zM43 5h12v13H43zM5 18h12v13H5zM30 18h13v13H30zM17 31h13v12H17zM43 31h12v12H43zM5 43h12v12H5zM30 43h13v12H30z" fill="#8b4f32"/><circle cx="23.5" cy="11.5" r="5" fill="#2f6bff" stroke="#1c1917" stroke-width="2.5"/><circle cx="36.5" cy="24.5" r="5" fill="#2f6bff" stroke="#1c1917" stroke-width="2.5"/><circle cx="23.5" cy="37" r="5" fill="#ff4b3e" stroke="#1c1917" stroke-width="2.5"/><circle cx="11" cy="49" r="5" fill="#ff4b3e" stroke="#1c1917" stroke-width="2.5"/></svg></span><span class="gt">Damas</span><span class="gd">Regras brasileiras: captura obrigatória e dama voadora.</span><span class="gs" id="s-damas"></span></button>
    <button class="game" data-g="domino"><span class="art a3"><svg viewBox="0 0 60 60"><g transform="rotate(-14 30 30)"><rect x="17" y="4" width="26" height="52" rx="6" fill="#fffaf0" stroke="#1c1917" stroke-width="3"/><path d="M21 30H39" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="11" r="2.8" fill="#ff4b3e"/><circle cx="30" cy="17" r="2.8" fill="#ff4b3e"/><circle cx="36" cy="23" r="2.8" fill="#ff4b3e"/><circle cx="24" cy="37" r="2.8" fill="#2f6bff"/><circle cx="36" cy="37" r="2.8" fill="#2f6bff"/><circle cx="24" cy="49" r="2.8" fill="#2f6bff"/><circle cx="36" cy="49" r="2.8" fill="#2f6bff"/></g></svg></span><span class="gt">Dominó</span><span class="gd">Sete peças para cada um. Quem bater primeiro vence.</span><span class="gs" id="s-domino"></span></button>
  </section>
  <footer class="foot"><button class="chip" id="reset">Zerar placar</button></footer>
</main>

<!-- JOGO -->
<main id="play" class="view">
  <div class="top">
    <button class="ico" id="back" aria-label="Voltar para a sala"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="gtitle"></h2>
    <button class="ico mutebtn" aria-label="Ligar ou desligar som"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M17 9c1.5 1.6 1.5 4.4 0 6M19.5 6.5c3 3 3 8 0 11"/></svg></button>
  </div>
  <div class="bar">
    <div class="pl" id="pl0"><span class="av"></span><span class="pt2"><span class="pn"></span><span class="pm"></span></span><b class="ps"></b></div>
    <span class="x">×</span>
    <div class="pl" id="pl1"><span class="av"></span><span class="pt2"><span class="pn"></span><span class="pm"></span></span><b class="ps"></b></div>
  </div>
  <p id="status" class="status" aria-live="polite"></p>
  <div id="stage"></div>
  <div class="tools"><button class="btn ghost" id="restart">Nova partida</button><button class="btn ghost" id="toLobby">Trocar jogo</button></div>
</main>

<div id="modal" class="modal" hidden><div class="box" id="box" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<canvas id="confetti"></canvas>

<script>
{
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const mk=st=>({get(k,d){try{const v=st.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{st.setItem(k,JSON.stringify(v))}catch(e){}}});
let LS,SS;try{LS=mk(localStorage);SS=mk(sessionStorage)}catch(e){LS=SS={get:(k,d)=>d,set(){}}}
const ART_URL='https://claude.ai/artifact/Cg5UZfm4NpQTAFUabdRpNj';
const COL=['#ff4b3e','#2f6bff'];
const TITLES={velha:'Jogo da Velha',forca:'Forca',damas:'Damas',domino:'Dominó'};
const GAMES=['velha','forca','damas','domino'];
const inClaude=()=>!!(window.claude&&typeof window.claude.use==='function');
const rid=()=>Math.floor(Math.random()*2e9)+1;
let muted=LS.get('duelo-mute',false);
let myName=LS.get('duelo-name','');
let S=null,me=0,local=false,code='',net=null,peerOn=false,shownRes=0,netState='idle';
const stage=$('#stage');
const nm=i=>(S&&String(S.names[i]||'').trim())||('Jogador '+(i+1));
const can=p=>local||(p===me&&peerOn);
const mine=p=>local||p===me;

/* ---------- som, vibração, aviso ---------- */
let ac=null;
function tone(f,d,type,v,delay){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+(delay||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.1));o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+(d||.1)+.03)}catch(e){}}
const sfx={
  a:()=>tone(560,.08,'square',.05),b:()=>tone(400,.08,'square',.05),
  bad:()=>{tone(200,.2,'sawtooth',.045);tone(150,.25,'sawtooth',.04,.1)},
  cap:()=>{tone(720,.06);tone(960,.09,'square',.05,.06)},
  king:()=>[660,880,1320].forEach((f,i)=>tone(f,.12,'triangle',.07,i*.08)),
  join:()=>[440,660].forEach((f,i)=>tone(f,.12,'triangle',.07,i*.1)),
  win:()=>[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.16,'triangle',.08,i*.1))
};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let tt=0;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200)}

/* ---------- bonequinhos ---------- */
function face(col,mood,who){
  const px=who===0?1.6:who===1?-1.6:0;
  const mouth=mood==='happy'?'<path d="M20 41 Q32 58 44 41 Z" fill="#1c1917"/><path d="M26 49 Q32 54 38 49" fill="#ff8f8f"/>'
    :'<path d="M23 43 Q32 50 41 43" fill="none" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>';
  const top=who===0?'<path d="M24 12 Q27 1 32 10 Q36 0 40 12" fill="none" stroke="#1c1917" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'
    :who===1?'<path d="M32 10V2" stroke="#1c1917" stroke-width="4"/><circle cx="32" cy="0" r="4.5" fill="#ffd84d" stroke="#1c1917" stroke-width="3"/>':'';
  return `<svg viewBox="0 -6 64 70" aria-hidden="true">${top}<circle cx="32" cy="36" r="25" fill="${col}" stroke="#1c1917" stroke-width="4"/><ellipse cx="22" cy="24" rx="7" ry="4" fill="#fff" opacity=".3" transform="rotate(-25 22 24)"/><ellipse cx="23" cy="32" rx="5" ry="6.5" fill="#fff"/><ellipse cx="41" cy="32" rx="5" ry="6.5" fill="#fff"/><circle cx="${23+px}" cy="33" r="3" fill="#1c1917"/><circle cx="${41+px}" cy="33" r="3" fill="#1c1917"/><circle cx="15" cy="42" r="3.5" fill="#fff" opacity=".35"/><circle cx="49" cy="42" r="3.5" fill="#fff" opacity=".35"/>${mouth}</svg>`;
}

/* ---------- estado compartilhado ---------- */
const blank=()=>({v:0,names:['',''],game:null,score:{velha:[0,0],forca:[0,0],damas:[0,0],domino:[0,0]},res:null,velha:null,forca:null,damas:null});
function valid(st){
  if(!st||typeof st!=='object'||typeof st.v!=='number'||!Array.isArray(st.names)||st.names.length!==2||!st.score)return false;
  if(st.game!==null&&!GAMES.includes(st.game))return false;
  for(const g of GAMES)if(!Array.isArray(st.score[g])||st.score[g].length!==2)return false;
  if(st.game==='velha'&&!(st.velha&&Array.isArray(st.velha.b)&&st.velha.b.length===9))return false;
  if(st.game==='forca'&&!(st.forca&&Array.isArray(st.forca.ch)&&st.forca.ch.length&&Array.isArray(st.forca.used)))return false;
  if(st.game==='domino'&&!(st.domino&&Array.isArray(st.domino.hands)&&st.domino.hands.length===2&&st.domino.hands.every(Array.isArray)&&Array.isArray(st.domino.chain)&&Array.isArray(st.domino.pile)))return false;
  if(st.game==='damas'&&!(st.damas&&Array.isArray(st.damas.pc)&&st.damas.pc.length===24))return false;
  st.names=st.names.map(n=>String(n||'').slice(0,12));
  return true;
}
function saveS(){if(code)SS.set('duelo-S-'+code,S)}
function commit(){S.v++;saveS();if(net)net.send(S);render()}
function incoming(st,from){
  if(local||!S||!valid(st))return;
  if(st.v>S.v||(st.v===S.v&&from===0&&me===1&&JSON.stringify(st)!==JSON.stringify(S))){
    S=st;saveS();
    if(S.names[me]!==myName){S.names[me]=myName;commit();return}
    render();
  }
}
function setPeer(on){
  if(on===peerOn)return;
  peerOn=on;
  if(on){sfx.join();buzz(30);setTimeout(()=>{if(peerOn)toast(`${nm(1-me)} ${me===0?'entrou na sala!':'está na sala!'}`)},400)}
  else if(S)toast(`${nm(1-me)} saiu da sala`);
  render();
}
function setNet(st,txt,note){
  netState=st;
  $('#led').className='led'+(st==='connecting'?' on':st==='ok'?' ok':st==='fail'?' bad':'');
  $('#netTxt').textContent=txt;$('#netNote').textContent=note||'';
  $('#retryRow').hidden=st!=='fail';
}

/* ---------- conexão: sala do Claude ou PeerJS ---------- */
async function netRoom(){
  const room=await window.claude.use('room');
  if(!room)throw new Error('room');
  let R=null;
  try{R=await room.join('duelo-'+code)}catch(e){R=null}
  const target=R||room;
  const hear=ch=>{
    let other=false;
    for(const p of ch.peers){
      if(p.sameTab||p.kind!=='viewer')continue;
      const d=p.presence&&p.presence.d;
      if(!d||d.c!==code||(d.me!==0&&d.me!==1))continue;
      if(d.me!==me)other=true;
      if(d.st)incoming(d.st,d.me);
    }
    setPeer(other);
  };
  target.onPeers(hear,e=>{setNet('fail','Sem conexão com a sala',msgFail());setPeer(false)});
  target.onConnection&&target.onConnection(c=>{if(c)setNet('ok','Conectado à sala');else if(netState==='ok')setNet('connecting','Reconectando…')});
  return{
    send:st=>target.presence({d:{c:code,me,st}}).catch(e=>{if(e&&e.code==='invalid_argument')toast('Jogada grande demais para enviar')}),
    close:()=>{try{R?R.leave():room.presence({d:null})}catch(e){}}
  };
}
function loadPeerJs(){return new Promise((ok,no)=>{if(window.Peer)return ok();const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=ok;s.onerror=()=>no(new Error('lib'));document.head.appendChild(s)})}
async function netPeer(){
  await loadPeerJs();
  let conn=null,peer=null,closed=false,tries=0;
  const hook=c=>{
    c.on('open',()=>{if(conn&&conn!==c){try{conn.close()}catch(e){}}conn=c;setNet('ok','Conectado');setPeer(true);c.send({st:S,me})});
    c.on('data',d=>{if(d&&d.st)incoming(d.st,d.me===1?1:0)});
    c.on('close',()=>{if(conn===c){conn=null;setPeer(false);if(me===1&&!closed)setTimeout(dial,1500)}});
  };
  const dial=()=>{if(closed||!peer||peer.destroyed)return;hook(peer.connect('duelo-'+code,{reliable:true}))};
  const start=()=>{
    peer=me===0?new Peer('duelo-'+code):new Peer();
    peer.on('open',()=>{tries=0;setNet('ok',me===0?'Sala aberta, esperando o adversário':'Procurando a sala…');if(me===1)dial()});
    if(me===0)peer.on('connection',hook);
    peer.on('disconnected',()=>{if(!closed)try{peer.reconnect()}catch(e){}});
    peer.on('error',e=>{
      const t=e&&e.type;
      if(t==='unavailable-id'&&tries<6){tries++;try{peer.destroy()}catch(x){}setTimeout(start,2500);setNet('connecting','Reabrindo a sala…');return}
      if(t==='peer-unavailable'){setNet('connecting','Esperando quem criou a sala…','Peça para quem criou a sala deixar a página aberta.');setTimeout(dial,3000);return}
      if(t==='network'||t==='server-error'||t==='socket-error'){setNet('connecting','Reconectando…');setTimeout(()=>{try{peer.reconnect()}catch(x){}},2500);return}
      setNet('fail','Não deu para conectar',msgFail());
    });
  };
  start();
  return{send:st=>{if(conn&&conn.open)try{conn.send({st,me})}catch(e){}},close:()=>{closed=true;try{peer&&peer.destroy()}catch(e){}}};
}
const msgFail=()=>inClaude()?'Aqui no Claude, os dois precisam estar logados e com acesso a esta página (dono: botão Compartilhar, convidando o amigo).':'Confira a internet dos dois celulares e tente de novo.';
async function connect(){
  setNet('connecting','Conectando…');
  try{
    net=inClaude()?await netRoom():await netPeer();
    if(inClaude())setNet('ok','Conectado à sala');
    net.send(S);
  }catch(e){net=null;setNet('fail','Não deu para conectar',msgFail())}
}

/* ---------- navegação ---------- */
function show(id){if($('#'+id).classList.contains('on'))return;$$('.view').forEach(v=>v.classList.toggle('on',v.id===id));scrollTo(0,0)}
const linkFor=()=>(inClaude()?ART_URL:location.href.split('#')[0])+'#sala-'+code;
function readName(){const v=$('#myname').value.trim();if(!v){$('#herr').textContent='Coloca seu nome primeiro!';sfx.bad();$('#myname').focus();return null}$('#herr').textContent='';myName=v.slice(0,12);LS.set('duelo-name',myName);return myName}
function enterRoom(asMe){
  me=asMe;local=false;peerOn=false;
  const saved=SS.get('duelo-S-'+code,null);
  S=saved&&valid(saved)?saved:blank();
  S.names[me]=myName;S.v++;saveS();
  LS.set('duelo-room-'+code,{me});
  try{location.hash='sala-'+code}catch(e){}
  $('#link').value=linkFor();
  show('lobby');render();connect();
}
function hostRoom(){if(!readName())return;sfx.a();code=Math.random().toString(36).slice(2,7).padEnd(5,'x');enterRoom(0)}
function joinRoom(){if(!readName())return;sfx.a();const r=LS.get('duelo-room-'+code,null);enterRoom(r&&r.me===0?0:1)}
function localGame(){if(!readName())return;sfx.a();if(net)net.close();net=null;local=true;me=0;code='';peerOn=true;S=blank();S.names=[myName,LS.get('duelo-p2','')];show('lobby');render()}
function leave(){if(net)net.close();net=null;S=null;local=false;peerOn=false;code='';closeModal();try{location.hash=''}catch(e){}bootHome();show('home')}
function bootHome(){
  $('#hf0').innerHTML=face(COL[0],'ok',0);$('#hf1').innerHTML=face(COL[1],'ok',1);
  $('#myname').value=myName;
  const m=/^sala-([a-z0-9]{5})$/.exec(location.hash.slice(1));
  if(m){code=m[1];$('#invite').hidden=false;$('#invite').textContent=`Você foi chamado para um duelo! Sala ${code.toUpperCase()}`;$('#bJoin').hidden=false;$('#bHost').hidden=true;$('#bHost').classList.add('ghost')}
  else{code='';$('#invite').hidden=true;$('#bJoin').hidden=true;$('#bHost').hidden=false}
}

/* ---------- desenho geral ---------- */
function render(){
  if(!S)return;
  try{
    if(!S.game){closeModal();show('lobby');renderLobby()}
    else{show('play');$('#gtitle').textContent=TITLES[S.game];bar();({velha:rV,forca:rF,damas:rD,domino:rDo})[S.game]()}
    if(S.res&&S.res.id!==shownRes){const r=S.res;shownRes=r.id;setTimeout(()=>{if(S&&S.res&&S.res.id===r.id)showRes(r)},Number(r.d)||700)}
    if(!S.res&&!$('#modal').hidden)closeModal();
  }catch(e){console.error(e)}
}
function renderLobby(){
  $('#lobTitle').textContent=local?'Mesmo celular':'Sala '+code.toUpperCase();
  [0,1].forEach(i=>{
    const w=$('#who'+i);
    w.querySelector('.av').innerHTML=face(COL[i],i===me||local||peerOn?'happy':'ok',i);
    const has=local||i===me||peerOn||String(S.names[i]||'').trim();
    w.querySelector('.wn').textContent=has?nm(i):'???';
    w.querySelector('.tag').textContent=local?'Jogador '+(i+1):i===me?'Você':peerOn?'Online':'Esperando…';
    w.classList.toggle('off',!local&&i!==me&&!peerOn);
  });
  const n2=$('#n2');n2.hidden=!local;$('#who1 .wn').hidden=local;
  if(local&&document.activeElement!==n2)n2.value=S.names[1]||'';
  $('#share').hidden=local;
  $('#shareH').textContent=peerOn?`${nm(1-me)} está na sala!`:me===0?'Chame seu adversário':'Entrando na sala';
  $('#shareP').textContent=peerOn?'Agora é só escolher um jogo aí embaixo. Qualquer um dos dois pode escolher.':me===0?'Mande este link. Quando ele abrir e colocar o nome, o duelo começa.':'Assim que quem criou a sala estiver com a página aberta, vocês se conectam.';
  $('#shareRow').hidden=!(navigator.share&&!inClaude());
  $$('.game').forEach(b=>b.disabled=!local&&!peerOn);
  GAMES.forEach(g=>{$('#s-'+g).textContent=`${nm(0)} ${S.score[g][0]} × ${S.score[g][1]} ${nm(1)}`});
}
function bar(){
  [0,1].forEach(i=>{
    const el=$('#pl'+i);el.querySelector('.av').innerHTML=face(COL[i],'ok',i);
    el.querySelector('.pn').textContent=nm(i);
    el.querySelector('.pm').textContent=local?'':i===me?'você':peerOn?'online':'desconectado';
    el.querySelector('.ps').textContent=S.score[S.game][i];
    el.classList.toggle('off',!local&&i!==me&&!peerOn);
  });
}
function turn(i){[0,1].forEach(k=>$('#pl'+k).classList.toggle('on',k===i))}
let lastSay='';
function say(t,wait){const s=$('#status');s.classList.toggle('wait',!!wait);if(t===lastSay)return;lastSay=t;s.textContent=t;s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump')}
function sayTurn(p,mineTxt,otherTxt){
  if(!local&&!peerOn){say(`${nm(1-me)} se desconectou. Esperando voltar`,true);return}
  if(local||p===me)say(mineTxt);else say(otherTxt,true);
}
const youOr=i=>!local&&i===me?'Sua vez':'Vez de '+nm(i);

/* ---------- modal / resultado ---------- */
function openModal(html){
  $('#box').innerHTML='<button class="mx" id="mx" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>'+html;
  const m=$('#modal');m.hidden=false;m.classList.remove('in');void m.offsetWidth;m.classList.add('in');
  $('#mx').onclick=closeModal;

const D={id:0,pcs:[],g:[],moves:[],sel:null,done:[],animN:-1,busy:false};
const DIRS=[[-1,-1],[-1,1],[1,-1],[1,1]];
const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const CROWN='<svg viewBox="0 0 24 20"><path d="M2 6l5 5 5-9 5 9 5-5-2 12H4z" fill="#ffd84d" stroke="#1c1917" stroke-width="2" stroke-linejoin="round"/></svg>';
const enc=p=>p.dead?-(1+p.p):p.r*8+p.c+(p.p?64:0)+(p.k?128:0);

}
function loadD(){
  D.pcs=S.damas.pc.map(dec);D.g=Array.from({length:8},()=>Array(8).fill(null));
  D.pcs.forEach(p=>{if(!p.dead){if(D.g[p.r][p.c])p.dead=true;else D.g[p.r][p.c]=p}});
  D.moves=allMoves(S.damas.t===1?1:0);
}
function caps(pc,r,c,taken){
  const out=[];
  for(const[dr,dc]of DIRS){
    if(!pc.k){
      const mr=r+dr,mc=c+dc,lr=r+2*dr,lc=c+2*dc;
      if(!inb(lr,lc))continue;
      const m=D.g[mr][mc];
      if(m&&m.p!==pc.p&&!taken.has(m.id)&&!D.g[lr][lc]){
        taken.add(m.id);const rest=caps(pc,lr,lc,taken);taken.delete(m.id);
        const st={r:lr,c:lc,cap:m.id};
        if(rest.length)rest.forEach(s=>out.push([st,...s]));else out.push([st]);
      }
    }else{
      let rr=r+dr,cc=c+dc;
      while(inb(rr,cc)&&!D.g[rr][cc]){rr+=dr;cc+=dc}
      if(!inb(rr,cc))continue;
      const m=D.g[rr][cc];
      if(m.p===pc.p||taken.has(m.id))continue;
      let lr=rr+dr,lc=cc+dc;
      while(inb(lr,lc)&&!D.g[lr][lc]){
        taken.add(m.id);const rest=caps(pc,lr,lc,taken);taken.delete(m.id);
        const st={r:lr,c:lc,cap:m.id};
        if(rest.length)rest.forEach(s=>out.push([st,...s]));else out.push([st]);
        lr+=dr;lc+=dc;

    caps(pc,pc.r,pc.c,new Set()).forEach(s=>cap.push({pc,s}));
    D.g[pc.r][pc.c]=pc;
    for(const[dr,dc]of DIRS){
      if(!pc.k){if(dr!==(p?1:-1))continue;const r=pc.r+dr,c=pc.c+dc;if(inb(r,c)&&!D.g[r][c])sim.push({pc,s:[{r,c,cap:null}]})}
      else{let r=pc.r+dr,c=pc.c+dc;while(inb(r,c)&&!D.g[r][c]){sim.push({pc,s:[{r,c,cap:null}]});r+=dr;c+=dc}}
    }

  if(cap.length){const mx=Math.max(...cap.map(m=>m.s.length));return cap.filter(m=>m.s.length===mx)}

}

  const k=D.done.length,hit=dCands().find(m=>m.s.length>k&&m.s[k].r===r&&m.s[k].c===c);
  if(hit){dStep(hit.s[k]);return}
  if(k>0){sfx.bad();say('Continue capturando com a mesma peça!');return}
  const pc=D.g[r][c];
  if(pc&&pc.p===X.t){
    if(D.moves.some(m=>m.pc===pc)){D.sel=pc;sfx.a();dHL()}
    else{const el=pEl(pc.id);el.classList.remove('nope');void el.offsetWidth;el.classList.add('nope');sfx.bad();buzz(40);
      say(mustCap()?'Captura obrigatória! Use a peça que está brilhando.':'Essa peça não tem para onde ir.')}
    return;
  }
  if(pc){say(local?`Agora é a vez de ${nm(X.t)}.`:'Essa peça é do adversário!');return}
  D.sel=null;dHL();
}
function dStep(st){
  D.done.push(st);
  const el=pEl(D.sel.id);el.classList.add('mv');el.style.setProperty('--r',st.r);el.style.setProperty('--c',st.c);
  if(st.cap!==null){pEl(st.cap).classList.add('hit');sfx.cap();buzz(18)}else sfx.b();
  if(dCands().some(m=>m.s.length>D.done.length)){dHL();say('Isso! Continue pulando…')}
  else{D.busy=true;dClearHL();setTimeout(dEnd,280)}
}
function dEnd(){
  const X=S.damas,p=D.sel,seq=D.done,last=seq[seq.length-1],wasMan=!p.k;
  D.g[p.r][p.c]=null;p.r=last.r;p.c=last.c;D.g[p.r][p.c]=p;
  let n=0;
  seq.forEach(s=>{if(s.cap!==null){const q=D.pcs[s.cap];q.dead=true;D.g[q.r][q.c]=null;n++}});
  if(!p.k&&((p.p===0&&p.r===0)||(p.p===1&&p.r===7)))p.k=true;
  X.pc=D.pcs.map(enc);
  X.q=(n||wasMan)?0:(X.q||0)+1;
  X.mv={n:(X.mv?X.mv.n:0)+1,pid:p.id,path:seq.map(s=>[s.r,s.c]),caps:seq.map(s=>s.cap===null?-1:s.cap)};
  D.animN=X.mv.n;
  const mover=X.t;X.t^=1;
  D.sel=null;D.done=[];D.busy=false;
  D.moves=allMoves(X.t);
  if(!D.moves.length){const left=D.pcs.some(q=>!q.dead&&q.p===X.t);setRes(mover,'damas',left?`${nm(X.t)} ficou sem jogadas.`:'Capturou todas as peças do adversário!','',700)}
  else if(X.q>=40)setRes(null,'damas','Foram 20 lances seguidos só de damas, sem captura.','Empate!',500);
  commit();
  if(n>1&&!S.res)toast(`Combo de ${n} peças!`);
}

/* ---------- DOMINÓ (duplo-seis, 7 peças, compra no monte) ---------- */
const PIPS={0:[],1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[1,0],[2,0],[0,2],[1,2],[2,2]]};
const PCOL=['#1c1917','#ff4b3e','#2f6bff','#1c1917','#ff4b3e','#2f6bff','#1c1917'];
const pv=v=>Math.max(0,Math.min(6,Math.trunc(Number(v))||0));
function tile(a,b,vert){
  a=pv(a);b=pv(b);const W=vert?40:80,H=vert?80:40;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="tl${vert?' v':''}" aria-label="Peça ${a} e ${b}"><rect x="1.5" y="1.5" width="${W-3}" height="${H-3}" rx="7" fill="#fffaf0" stroke="#1c1917" stroke-width="3"/>`;
  s+=vert?'<path d="M7 40H33" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>':'<path d="M40 7V33" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>';
  [a,b].forEach((v,h)=>{const ox=vert?0:h*40,oy=vert?h*40:0;PIPS[v].forEach(([x,y])=>{const px=vert?y:x,py=vert?x:y;s+=`<circle cx="${ox+8+px*12}" cy="${oy+8+py*12}" r="3.9" fill="${PCOL[v]}"/>`})});
  return s+'</svg>';
}
function newDomino(){
  const all=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)all.push([a,b]);
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
  const hands=[all.slice(0,7),all.slice(7,14)];let t=0,best=-1;
  hands.forEach((h,p)=>h.forEach(([a,b])=>{const sc=a===b?100+a:a+b;if(sc>best){best=sc;t=p}}));
  return{id:rid(),hands,pile:all.slice(14),chain:[],t,pass:0,n:0,last:null};
}
const DO={id:0,sel:-1,seenN:-1,revealT:-1};
const dEnds=X=>X.chain.length?[pv(X.chain[0][0]),pv(X.chain[X.chain.length-1][1])]:null;
function dSides(X,tl){const e=dEnds(X);if(!e)return['R'];const s=[];if(tl[0]==e[0]||tl[1]==e[0])s.push('L');if(tl[0]==e[1]||tl[1]==e[1])s.push('R');return s}
const domTurn=X=>{const t=X.t===1?1:0;return can(t)&&!S.res&&(!local||DO.revealT===t)};
function rDo(){
  const X=S.domino,t=X.t===1?1:0,viewer=local?t:me,opp=1-viewer;
  if(stage.dataset.k!=='do'+X.id){
    stage.dataset.k='do'+X.id;DO.sel=-1;DO.seenN=X.n;DO.revealT=-1;
    stage.innerHTML='<div class="dom"><div class="opp" id="dOpp"></div><div class="table" id="dTable"></div><div class="hand" id="dHand"></div><div class="row" id="dAct" style="margin-top:0"></div></div>';
  }
  const isNew=X.n!==DO.seenN,L=X.last;
  if(isNew){DO.sel=-1;if(L){if(L.k==='play')sfx.cap();else if(L.k==='buy')sfx.b();else sfx.bad();if(!mine(L.p))buzz(20)}}
  DO.seenN=X.n;
  const my=domTurn(X),hand=X.hands[viewer]||[],e=dEnds(X);
  const ok=hand.map(tl=>my&&dSides(X,tl).length>0),any=ok.some(Boolean);
  // adversário
  const on=X.hands[opp].length;
  $('#dOpp').innerHTML=`<span class="av">${face(COL[opp],'ok',opp)}</span><span>${esc(nm(opp))} · ${on} peça${on===1?'':'s'}</span><span class="backs" style="--bc:${COL[opp]}">${'<i class="bk"></i>'.repeat(Math.min(on,21))}</span>`;
  // mesa
  const selT=DO.sel>=0?hand[DO.sel]:null,choose=selT?dSides(X,selT):[];
  const chip=s=>`<button class="endc${choose.length>1&&choose.includes(s)?' go':''}" data-s="${s}" ${choose.length>1?'':'tabindex="-1"'}>${s==='L'?'◀ ':''}${e?e[s==='L'?0:1]:''}${s==='R'?' ▶':''}</button>`;
  const tiles=X.chain.map((c,i)=>{const a=pv(c[0]),b=pv(c[1]);return `<span class="ct${isNew&&L&&L.k==='play'&&L.i===i?' new':''}">${tile(a,b,a===b)}</span>`}).join('');
  $('#dTable').innerHTML=`<span class="pilec">Monte: ${X.pile.length}</span>`+(X.chain.length?chip('L')+tiles+chip('R'):'<p class="empty">Mesa vazia. Quem tem a maior carroça começa!</p>');
  $('#dTable').querySelectorAll('.endc.go').forEach(b=>b.onclick=()=>domPlay(DO.sel,b.dataset.s));
  // minha mão
  if(local&&DO.revealT!==t&&!S.res){
    $('#dHand').innerHTML=`<button class="btn blue cover" id="dCover">${esc(nm(t))}, toque para ver suas peças</button>`;
    $('#dCover').onclick=()=>{DO.revealT=t;sfx.a();rDo()};
  }else{
    $('#dHand').innerHTML=hand.map((tl,i)=>`<button class="ht${ok[i]?' ok':my?' dim':''}${i===DO.sel?' sel':''}${isNew&&L&&L.k==='buy'&&L.p===viewer&&i===hand.length-1?' new':''}" data-h="${i}">${tile(tl[0],tl[1],true)}</button>`).join('')||'<p class="empty">Sem peças!</p>';
    $('#dHand').querySelectorAll('.ht').forEach(b=>b.onclick=()=>domTap(+b.dataset.h));
  }
  // ações
  let act='';
  if(my&&!any)act=X.pile.length?`<button class="btn gold" id="dBuy">Comprar do monte (${X.pile.length})</button>`:'<button class="btn ghost" id="dPass">Passar a vez</button>';
  if(my&&choose.length>1)act=`<button class="btn" id="dL">◀ Na ponta ${e[0]}</button><button class="btn" id="dR">Na ponta ${e[1]} ▶</button>`;
  $('#dAct').innerHTML=act;
  const bb=$('#dBuy');if(bb)bb.onclick=domBuy;const bp=$('#dPass');if(bp)bp.onclick=domPass;
  const bl=$('#dL');if(bl){bl.onclick=()=>domPlay(DO.sel,'L');$('#dR').onclick=()=>domPlay(DO.sel,'R')}
  // status
  if(S.res){turn(S.res.w);say(S.res.w===null?'Empate!':`${nm(S.res.w)} venceu!`);return}
  turn(t);
  const opener=!X.chain.length?' · comece com qualquer peça':'';
  if(local&&DO.revealT!==t){say(`Vez de ${nm(t)}. Passa o celular!`);return}
  sayTurn(t,!any?(X.pile.length?`${youOr(t)} · nenhuma peça encaixa, compre do monte`:`${youOr(t)} · nada encaixa e o monte acabou, passe a vez`):choose.length>1?'Escolha a ponta':`${youOr(t)} · toque numa peça que brilha${opener}`,`Vez de ${nm(t)}${L&&L.k==='buy'&&L.p===t?' · comprando do monte':''}`);
}
function domTap(i){
  const X=S.domino,t=X.t===1?1:0;
  if(!domTurn(X)){sfx.bad();if(!local&&peerOn&&!S.res)toast(`Calma! É a vez de ${nm(t)}.`);return}
  const tl=X.hands[t][i];if(!tl)return;
  const s=dSides(X,tl),e=dEnds(X);
  if(!s.length){sfx.bad();buzz(40);say('Essa peça não encaixa em nenhuma ponta.');return}
  if(s.length===1||e[0]===e[1]){domPlay(i,s[0]);return}
  DO.sel=DO.sel===i?-1:i;sfx.a();rDo();
}
function domPlay(i,side){
  const X=S.domino,t=X.t===1?1:0;
  if(!domTurn(X))return;
  const hand=X.hands[t],tl=hand[i];if(!tl||!dSides(X,tl).includes(side))return;
  hand.splice(i,1);
  const a=pv(tl[0]),b=pv(tl[1]);let idx;
  if(!X.chain.length){X.chain.push([a,b]);idx=0}
  else if(side==='L'){const E=pv(X.chain[0][0]);X.chain.unshift(b===E?[a,b]:[b,a]);idx=0}
  else{const E=pv(X.chain[X.chain.length-1][1]);X.chain.push(a===E?[a,b]:[b,a]);idx=X.chain.length-1}
  X.pass=0;X.n++;X.last={k:'play',p:t,i:idx};DO.sel=-1;DO.seenN=X.n;sfx.cap();buzz(15);
  if(!hand.length)setRes(t,'domino','Bateu! Ficou sem nenhuma peça na mão.','',900);
  else X.t=1-t;
  commit();
}
function domBuy(){
  const X=S.domino,t=X.t===1?1:0;
  if(!domTurn(X)||!X.pile.length)return;
  if(X.hands[t].some(tl=>dSides(X,tl).length)){toast('Você tem peça que encaixa!');return}
  X.hands[t].push(X.pile.splice(Math.floor(Math.random()*X.pile.length),1)[0]);
  X.n++;X.last={k:'buy',p:t};DO.seenN=X.n;sfx.b();commit();
}
function domPass(){
  const X=S.domino,t=X.t===1?1:0;
  if(!domTurn(X)||X.pile.length)return;
  X.pass=(X.pass||0)+1;X.n++;X.last={k:'pass',p:t};DO.seenN=X.n;sfx.bad();
  if(X.pass>=2){
    const pts=X.hands.map(h=>h.reduce((s,tl)=>s+pv(tl[0])+pv(tl[1]),0));
    const w=pts[0]===pts[1]?null:pts[0]<pts[1]?0:1;
    setRes(w,'domino',`Jogo trancado! Pontos na mão: ${nm(0)} ${pts[0]}, ${nm(1)} ${pts[1]}. Menos pontos vence.`,w===null?'Empate!':'',700);
  }else X.t=1-t;
  commit();
}

/* ---------- ligações ---------- */
$('#bHost').onclick=hostRoom;$('#bJoin').onclick=joinRoom;$('#bLocal').onclick=localGame;
$('#myname').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();(code?joinRoom:hostRoom)()}};
$('#leave').onclick=leave;
$('#back').onclick=toLobby;$('#toLobby').onclick=toLobby;
$('#restart').onclick=()=>{if(!S||!S.game)return;if(!local&&!peerOn){toast('Seu adversário está desconectado');return}S.res=null;newGame(S.game);commit()};
$$('.game').forEach(b=>b.onclick=()=>pickGame(b.dataset.g));
$('#n2').oninput=e=>{if(!local)return;S.names[1]=e.target.value.slice(0,12);LS.set('duelo-p2',S.names[1]);S.v++;renderLobby()};
$('#copy').onclick=()=>{
  const v=$('#link').value;
  const ok=()=>{toast('Link copiado! Agora manda pro seu amigo.');sfx.a()};
  const fall=()=>{const i=$('#link');i.focus();i.select();try{document.execCommand('copy')?ok():toast('Segure no link para copiar')}catch(e){toast('Segure no link para copiar')}};
  try{navigator.clipboard.writeText(v).then(ok,fall)}catch(e){fall()}
};
$('#nshare').onclick=()=>{try{navigator.share({title:'Duelo!',text:`${myName} te chamou para um duelo!`,url:$('#link').value}).catch(()=>{})}catch(e){}};
$('#link').onclick=e=>e.target.select();
$('#retry').onclick=()=>{if(net)net.close();net=null;connect()};
$('#reset').onclick=()=>{if(!S)return;S.score={velha:[0,0],forca:[0,0],damas:[0,0],domino:[0,0]};sfx.b();commit()};
function muteUI(){$('#mute1').textContent=muted?'Som desligado':'Som ligado';$$('.wave').forEach(w=>w.style.opacity=muted?.15:1)}
const toggleMute=()=>{muted=!muted;LS.set('duelo-mute',muted);muteUI();sfx.a()};
$('#mute1').onclick=toggleMute;$$('.mutebtn').forEach(b=>b.onclick=toggleMute);
addEventListener('hashchange',()=>{if(!S)bootHome()});
muteUI();bootHome();
}
